[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointsbot"
version = "1.0.0"
description = "Two Telegram bots that award/deduct points, backed by Google Sheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
    "gspread>=6.0,<7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pointsbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pointsbot", "tests"]
